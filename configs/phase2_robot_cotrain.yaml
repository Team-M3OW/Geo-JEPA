# Geo-JEPA Training Phase 2: Cross-Embodiment Robot Co-Training
# Loss: L = L_FM + beta * L_WM_sem + gamma(t) * L_WM_geo + alpha(t) * L_geo

run_id: "phase2_robot_cotrain"
run_root_dir: "/media/kavinder/hdd2/geo_jepa_runs"
pretrained_checkpoint: "/media/kavinder/hdd2/geo_jepa_runs/phase1_video_pretrain/checkpoints/phase1_step_02000.pt"

framework:
  framework_py: "Geo_JEPA"
  qwenvl:
    base_vlm: "Qwen/Qwen2.5-VL-3B-Instruct"
  
  vj2_model:
    base_encoder: "facebook/vjepa2-vitl-fpc64-256"
    special_action_token: "<|action_{}|>"
    embodied_action_token: "<|embodied_action|>"
    num_frames: 4
    depth: 12
    num_heads: 16
    num_action_tokens_per_timestep: 3
    num_embodied_action_tokens_per_instruction: 8
    beta: 0.1

  action_model:
    action_type: "GR00T"
    future_action_window_size: 7
    past_action_window_size: 0
    action_horizon: 8
    action_dim: 7
    diffusion_model_cfg:
      cross_attention_dim: 2048

  geometric_forcing:
    enable_geo_alignment: true    # Phase 2 alignment enabled
    enable_geo_wm_head: true      # Phase 3 dual-head prediction enabled
    alpha: 0.5                    # Alignment coefficient
    gamma: 0.1                    # Geometric WM coefficient
    geo_target_dim: 128           # 64 tracks * 2 coords
    alignment_layer_idx: 24       # ~75% depth
    warmup_steps: 1000            # Warmup over initial 1,000 steps
    warmup_schedule: "linear"

datasets:
  vla_data:
    dataset_py: "libero_dataset"
    data_mix: "libero_spatial"
    data_root_dir: "/media/kavinder/hdd2/datasets/libero/libero_spatial"
    cache_root_dir: "/media/kavinder/hdd2/geo_jepa_cache/libero"
    per_device_batch_size: 4
    CoT_prompt: "Task: {instruction} Actions: {actions} Embodied: {e_actions}"

trainer:
  max_train_steps: 5000
  log_every_n_steps: 10
  save_every_n_steps: 1000
  gradient_accumulation_steps: 2
  gradient_clipping: 1.0
  learning_rate:
    base: 1.0e-4
  optimizer:
    betas: [0.9, 0.95]
